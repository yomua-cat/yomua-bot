[package]
name = "yomua-bot"
version = "0.1.0"
edition = "2021"
description = "Character Runtime / Character Agent Framework"
license = "MIT OR Apache-2.0"

[[bin]]
name = "yomua-bot"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# SQLite
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config
toml = "0.8"

# IPC (for plugin system)
rmp-serde = "1"

# WebSocket (OneBot adapter)
tokio-tungstenite = { version = "0.24", features = ["handshake"] }
futures-util = "0.3"

# Async trait support
async-trait = "0.1"

# PNG metadata (character card tEXt chunk)
png = "0.17"

# HTTP client (OpenAI-compatible LLM provider)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# 随机数（用于多 Bot 回复打乱顺序）
rand = "0.8"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
